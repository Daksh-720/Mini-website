<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroNova Regi.in</title>

  <link rel="stylesheet" href="styles.css">
  
</head>

 

<body>

 <div class="form-container">
    
    <h2 class="title-outline">Shop Now at ElectroNova</h2>

    <form action="electroNova.html" method="post">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required placeholder="Enter full name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="abc@gmail.com">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="5 characters">

      <label for="numb.">Mobile phone</label>
      <input type="number" id="numb." name="numb." required pattern="[0-9]{4} [0-9]{2} [0-9]{4}" placeholder="1234-56-7890">

      <label for="fileupload">Please select your image:</label>
      <input type="file" NAME="fileupload" accept="image/*"/>



      <button onclick="myFunction()">Register</button><br><br>
      <input type="reset" value="Reset">
      <script>
      function myFunction() {
      alert("Registered Successfully ");

      if(document.getElementById("fullname")==""){
         document.write("please fill this detail")
        }

      }
      </script>

    </form>
  </div>
 

</body>

</html>
